name: figma_flutter_builder
description: A visual builder that imports Figma designs and generates editable, compilable Flutter applications.
publish_to: 'none'
version: 0.1.0

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  http: ^1.2.1
  dio: ^5.4.3
  json_annotation: ^4.9.0
  collection: ^1.18.0
  uuid: ^4.4.0
  path: ^1.9.0
  archive: ^3.5.1
  fl_chart: ^0.68.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.11
  json_serializable: ^6.8.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
